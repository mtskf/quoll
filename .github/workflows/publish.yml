name: Publish Extension

on:
  push:
    tags:
      - 'v*'

# NOTE: This workflow is ACTIVE. On a pushed `v*` tag it packages one .vsix and publishes
# it to the VS Code Marketplace (VSCODE_PAT secret, required — configured). The Open VSX
# step (OPENVSX_PAT secret, optional) is skipped while that secret is unset, so releases
# currently go to the Marketplace only. The publisher ID (`mtskf`) matches
# `package.json.publisher`. Tag pushes trigger a LIVE publish (v0.1.0 shipped 2026-07-02),
# so never push a `v*` tag until you intend to release that version to users.

# Least-privilege GITHUB_TOKEN. Marketplace / Open VSX publishing uses the
# VSCODE_PAT / OPENVSX_PAT secrets, not the workflow token, so those stay
# read-only. The two write scopes below are required ONLY by the attestation
# steps: `id-token: write` mints the Sigstore OIDC token, `attestations: write`
# records the provenance + SBOM attestations in the repo's attestation store.
# (No `artifact-metadata: write` — that is only needed for registry storage
# records, which this file-subject attestation does not create.)
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # All GitHub Actions are pinned to commit SHAs — supply-chain hardening.
      # The threat (tag remutation against a compromised maintainer / repo) applies
      # equally to first-party `actions/*` and third-party actions, so the same
      # policy covers both. When bumping, resolve the commit SHA with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'` — this handles both
      # lightweight and annotated tags (e.g. `pnpm/action-setup` uses annotated tags,
      # and `git/refs/tags/<tag>` would return its tag-object SHA, not the commit).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Reachability gate — the FIRST thing after checkout so nothing else runs
      # for an off-main tag. Branch protection does NOT cover tag refs, so a `v*`
      # tag pushed onto an unreviewed feature/WIP commit (with a bumped
      # package.json) would otherwise publish that code LIVE to the Marketplace +
      # Open VSX. Require the tagged commit ($GITHUB_SHA — a tag push points it at
      # the tagged commit) to be reachable from origin/main, the only history that
      # passes review, before ANY build or publish step. The default checkout is
      # shallow (depth 1), so deepen main first. The explicit refspec is required:
      # checkout configures origin to fetch the tag ref, not a branch wildcard, so
      # a bare `git fetch origin main` would update FETCH_HEAD without writing
      # refs/remotes/origin/main. --unshallow gives merge-base main's full
      # ancestry to walk; the `|| fetch` fallback covers the already-complete case
      # (where --unshallow errors). A fetch failure or missing origin/main leaves
      # merge-base to exit non-zero, which blocks the publish — fail-safe.
      - name: Verify tag is reachable from main (release gate)
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "::error::Tagged commit $TAGGED_SHA is not reachable from origin/main — refusing to publish unreviewed code."
            exit 1
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install extension deps
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Release security gate. Fails the publish on High/Critical advisories
      # in the bundled runtime — every package esbuild bakes into
      # dist/extension.cjs / dist/webview/index.js lives in `dependencies`,
      # so `--prod` scans exactly the surface that ships in the .vsix.
      # Pure build/test tooling (Biome, Vitest, vsce, ovsx, esbuild, happy-dom,
      # @types/*, typescript) stays in `devDependencies` and is intentionally
      # excluded — those packages never reach a user. Approved exceptions
      # must be both documented in a dated release-security-audit note kept
      # with the project's private maintenance docs and added to the
      # `auditConfig.ignoreGhsas` array in pnpm-workspace.yaml (pnpm 11's bulk
      # advisory endpoint returns GHSA ids, not CVEs).
      - name: Audit production dependencies (security gate)
        run: pnpm audit --prod --audit-level=high

      - name: Build (webview + extension + esbuild bundle)
        run: pnpm build

      # Assemble the SHIPPED runtime dependency closure in a throwaway staging
      # tree so the SBOM below reflects what actually ships, not the build-input
      # graph. A prod-only frozen install yields a node_modules containing
      # exactly the runtime closure at EXACT resolved versions; the lockfile is
      # then removed so syft catalogs that node_modules (not the dev entries in
      # the lock graph — and the residual hidden node_modules/.pnpm/lock.yaml is
      # named `lock.yaml`, not `pnpm-lock.yaml`, so syft's pnpm-lock cataloger
      # does not match it). Built in $RUNNER_TEMP (outside the workspace) so it
      # can never be picked up by the package/audit/attest/publish steps, and it
      # leaves the workspace node_modules intact — the Package step below still
      # needs the dev-only vsce. package.json + pnpm-lock.yaml + pnpm-workspace.yaml
      # (overrides + release-age cooldown) + .npmrc (hoist/registry policy) are
      # all copied so --frozen-lockfile resolves identically to the real install.
      - name: Assemble shipped runtime dependency tree (SBOM source)
        run: |
          STAGING="$RUNNER_TEMP/sbom-src"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$STAGING"/
          if [ -f .npmrc ]; then cp .npmrc "$STAGING"/; fi
          ( cd "$STAGING" && pnpm install --prod --frozen-lockfile --ignore-scripts )
          rm -f "$STAGING/pnpm-lock.yaml"

      # Supply-chain transparency. Syft (v1.42.3, baked into the SHA-pinned
      # sbom-action release below; Dependabot bumps the action + its Syft
      # together — so we deliberately do NOT set `syft-version`, which would
      # drift from that baked default) catalogs the staging prod tree into an
      # SPDX SBOM: the shipped runtime dependency closure at exact resolved
      # versions, with devDependencies (vitest/biome/@types/*, etc.) excluded.
      # That SBOM is bound to the .vsix digest by the Attest SBOM step below, so
      # a consumer verifying the attestation sees only the shipped surface — no
      # false-positive advisory matches against build-only tooling.
      #
      # Scope note: this lists the prod *dependency closure* — a conservative
      # superset of the esbuild-bundled set (it also lists prod-transitive deps
      # that get tree-shaken out). A byte-exact bundled SBOM would need a
      # hand-rolled SPDX generator off the esbuild metafile; deferred as a
      # future refinement. The verify step below pins the guarantees this SBOM
      # must hold.
      #
      # Ordering: this is the only third-party action on the build→package→attest
      # critical path (pnpm/action-setup is a third-party action too, but runs
      # earlier during setup, before any artifact exists), and it still runs
      # BEFORE Package .vsix, so audit-vsix (below) remains the last gate before
      # attest + publish — a compromised action here cannot mutate an
      # already-audited .vsix (none exists yet). It scans the staging tree, not
      # the workspace, so it does not need the packaged .vsix. Release-asset
      # upload is disabled — this job holds only `contents: read`; the SBOM is
      # kept as the sbom-action workflow artifact instead.
      #
      # `config:` is REQUIRED, not cosmetic: syft's package.json cataloger is
      # image-scan-only, so a directory scan of the lockfile-less staging tree
      # catalogs zero npm packages without it. Rationale in full: .github/syft-release.yaml.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/sbom-src
          config: .github/syft-release.yaml
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      # Gate: fail the release if the SBOM is not scoped to the shipped runtime
      # (dev tooling leaked in, a declared/known-transitive runtime dep missing,
      # or non-exact versions). Fail-safe — a misleading attestation never ships.
      - name: Verify SBOM is scoped to the shipped runtime
        run: node scripts/verify-sbom-scope.mjs sbom.spdx.json

      # SHADOW (non-gating) reconciliation. Runs the opt-in --reconcile check
      # against the same frozen prod staging tree the SBOM was generated from,
      # comparing the attested SBOM's {name@version} set to the tree's real
      # package manifests. `|| true` keeps it NON-gating: a mismatch prints to
      # the run log but never fails a live publish. Purpose: collect evidence
      # that the manifest-derived inventory equals what the pinned syft (v1.42.3)
      # catalogs, on real staging trees, BEFORE promoting this to a gate.
      # ENABLEMENT CRITERIA (do this to make it gating): once the log shows a
      # clean reconcile across a release (no "unexpected"/"missing"/"version
      # mismatch" lines), fold `--reconcile "$RUNNER_TEMP/sbom-src"` into the
      # gating step above and delete this shadow step.
      - name: Reconcile SBOM against staged install (shadow, non-gating)
        run: node scripts/verify-sbom-scope.mjs sbom.spdx.json --reconcile "$RUNNER_TEMP/sbom-src" || true

      - name: Package .vsix
        run: pnpm exec vsce package --no-dependencies -o extension.vsix

      # Release gate. Inspects the just-packaged .vsix against an
      # allowlist (mirrors .vscodeignore) and fails the publish if
      # any internal file (docs/, .github/, .claude/, raw *.ts,
      # *.map, lockfiles, .env*, coverage, test fixtures) slipped
      # into the bundle. Tag pushes go live to Marketplace + Open
      # VSX — this is the last line of defence.
      - name: Audit .vsix contents
        run: node scripts/audit-vsix.mjs extension.vsix

      # Signed build provenance for the exact bytes we are about to publish, via
      # the unified actions/attest (Provenance mode = no sbom-path). GitHub has
      # folded the older attest-build-provenance / attest-sbom wrappers into this
      # action (attest-sbom is deprecated), so we use the canonical core action
      # for both legs. Attests extension.vsix against the workflow run through
      # Sigstore; consumers verify with
      # `gh attestation verify extension.vsix --repo mtskf/quoll`. Placed before
      # publish so an attestation failure blocks the release rather than shipping
      # an unattested artifact, and so the attested digest equals the bytes
      # handed to Marketplace + Open VSX.
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: extension.vsix

      # Bind the SBOM to the same .vsix digest (SBOM mode = sbom-path) so a
      # consumer can retrieve the dependency graph for the artifact they got.
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: extension.vsix
          sbom-path: sbom.spdx.json

      # Token is read implicitly from the VSCE_PAT env var — never passed as a
      # `-p <token>` CLI arg, so the secret cannot leak into process arguments.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --packagePath extension.vsix

      # Token is read implicitly from the OVSX_PAT env var (same rationale as above).
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: pnpm exec ovsx publish extension.vsix
