name: Publish Extension

on:
  push:
    tags:
      - 'v*'

# A pushed `v*` tag triggers a live release to the VS Code Marketplace via OIDC
# Trusted Publishing and to Open VSX via OPENVSX_PAT.
#
# Job chain: build → attest → publish-marketplace → publish-openvsx. The chain
# keeps a failed Marketplace publish from reaching Open VSX. Use Re-run failed
# jobs, never Re-run all jobs. A failed-job retry reuses successful job outputs
# and the artifact from the earlier attempt, so an Open VSX failure can retry
# just that registry with the audited .vsix. Re-running all jobs after
# Marketplace succeeds rebuilds the .vsix, fails red at Marketplace on the
# duplicate version and publishes nothing new. Recover with a version bump.
# A registry that stored the upload but reported failure also retries red
# on the duplicate version. Check the registry page, then bump the version.
#
# The workflow token stays read-only. Only attest (Sigstore signing) and
# publish-marketplace (Trusted Publishing exchange) hold id-token: write.
# The Trusted Publishing policy matches this workflow file, so any step with
# an OIDC grant can mint a Marketplace credential. Keeping the grant out of
# build keeps it away from the build tools and anchore/sbom-action. Open VSX
# authenticates with its own token and needs only contents: read.
# File-subject attestations need attestations: write. Registry storage records
# would also need artifact-metadata: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vsix-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      # All GitHub Actions are pinned to commit SHAs — supply-chain hardening.
      # The threat (tag remutation against a compromised maintainer / repo) applies
      # equally to first-party `actions/*` and third-party actions, so the same
      # policy covers both. When bumping, resolve the commit SHA with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'` — this handles both
      # lightweight and annotated tags (e.g. `pnpm/action-setup` uses annotated tags,
      # and `git/refs/tags/<tag>` would return its tag-object SHA, not the commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reachability gate — the FIRST thing after checkout so nothing else runs
      # for an off-main tag. Branch protection does NOT cover tag refs, so a `v*`
      # tag pushed onto an unreviewed feature/WIP commit (with a bumped
      # package.json) would otherwise publish that code LIVE to the Marketplace +
      # Open VSX. Require the tagged commit ($GITHUB_SHA — a tag push points it at
      # the tagged commit) to be reachable from origin/main, the only history that
      # passes review, before ANY build or publish step. The default checkout is
      # shallow (depth 1), so deepen main first. The explicit refspec is required:
      # checkout configures origin to fetch the tag ref, not a branch wildcard, so
      # a bare `git fetch origin main` would update FETCH_HEAD without writing
      # refs/remotes/origin/main. --unshallow gives merge-base main's full
      # ancestry to walk; the `|| fetch` fallback covers the already-complete case
      # (where --unshallow errors). A fetch failure or missing origin/main leaves
      # merge-base to exit non-zero, which blocks the publish — fail-safe.
      - name: Verify tag is reachable from main (release gate)
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null \
            || git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAGGED_SHA" origin/main; then
            echo "::error::Tagged commit $TAGGED_SHA is not reachable from origin/main — refusing to publish unreviewed code."
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.10.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install extension deps
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Release security gate. Fails the publish on High/Critical advisories
      # in the bundled runtime — every package esbuild bakes into
      # dist/extension.cjs / dist/webview/index.js lives in `dependencies`,
      # so `--prod` scans exactly the surface that ships in the .vsix.
      # Pure build/test tooling (Biome, Vitest, vsce, ovsx, esbuild, happy-dom,
      # @types/*, typescript) stays in `devDependencies` and is intentionally
      # excluded — those packages never reach a user. Approved exceptions
      # must be both documented in a dated release-security-audit note kept
      # with the project's private maintenance docs and added to the
      # `auditConfig.ignoreGhsas` array in pnpm-workspace.yaml (pnpm 11's bulk
      # advisory endpoint returns GHSA ids, not CVEs).
      - name: Audit production dependencies (security gate)
        run: pnpm audit --prod --audit-level=high

      - name: Build (webview + extension + esbuild bundle)
        run: pnpm build

      # Assemble the SHIPPED runtime dependency closure in a throwaway staging
      # tree so the SBOM below reflects what actually ships, not the build-input
      # graph. The script is shared with ci.yml's `sbom` job, which rehearses this
      # whole sequence on every PR — WHY each line is needed lives in the script.
      - name: Assemble shipped runtime dependency tree (SBOM source)
        run: scripts/assemble-sbom-staging.sh "${RUNNER_TEMP:?RUNNER_TEMP is not set}/sbom-src"

      # Supply-chain transparency. Syft (v1.42.3, baked into the SHA-pinned
      # sbom-action release below; Dependabot bumps the action + its Syft
      # together — so we deliberately do NOT set `syft-version`, which would
      # drift from that baked default) catalogs the staging prod tree into an
      # SPDX SBOM: the shipped runtime dependency closure at exact resolved
      # versions, with devDependencies (vitest/biome/@types/*, etc.) excluded.
      # That SBOM is bound to the .vsix digest by `attest`'s Attest SBOM step, so
      # a consumer verifying the attestation sees only the shipped surface — no
      # false-positive advisory matches against build-only tooling.
      #
      # Scope note: this lists the prod *dependency closure* — a conservative
      # superset of the esbuild-bundled set (it also lists prod-transitive deps
      # that get tree-shaken out). A byte-exact bundled SBOM would need a
      # hand-rolled SPDX generator off the esbuild metafile; deferred as a
      # future refinement. The verify step below pins the guarantees this SBOM
      # must hold.
      #
      # Ordering keeps SBOM generation before packaging. The action has no
      # packaged bytes to modify, and audit-vsix gates the exact .vsix before
      # build records its digest. Build has no id-token grant, so it cannot
      # mint a Marketplace credential. The SBOM travels to attest in the
      # handoff artifact and remains available as the sbom-action artifact.
      #
      # `config:` is REQUIRED, not cosmetic: syft's package.json cataloger is
      # image-scan-only, so a directory scan of the lockfile-less staging tree
      # catalogs zero npm packages without it. Rationale in full: .github/syft-release.yaml.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-src
          config: .github/syft-release.yaml
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      # Gate: fail the release if the SBOM is not scoped to the shipped runtime
      # (dev tooling leaked in, a declared/known-transitive runtime dep missing,
      # or non-exact versions), or if it does not RECONCILE against the staging
      # tree it was generated from — see scripts/verify-sbom-scope.mjs for what
      # `--reconcile` compares and the evidence behind promoting it to a gate.
      # Fail-safe — a misleading attestation never ships.
      #
      # Deliberately no `|| true`: the script distinguishes clean from a
      # reconcile diff from could-not-reconcile-at-all by exit code, and
      # swallowing the status collapses all three into a green step — the
      # could-not-reconcile run prints none of the diff lines, so it reads as
      # clean while having verified nothing.
      - name: Verify SBOM is scoped to the shipped runtime
        run: node scripts/verify-sbom-scope.mjs sbom.spdx.json --reconcile "${RUNNER_TEMP:?RUNNER_TEMP is not set}/sbom-src"

      - name: Package .vsix
        run: pnpm exec vsce package --no-dependencies -o extension.vsix

      # Release gate. Inspects the just-packaged .vsix against an
      # allowlist (mirrors .vscodeignore) and fails the publish if
      # any internal file (docs/, .github/, .claude/, raw *.ts,
      # *.map, lockfiles, .env*, coverage, test fixtures) slipped
      # into the bundle. Tag pushes go live to Marketplace + Open
      # VSX — this is the last content gate before attest + publish.
      - name: Audit .vsix contents
        run: node scripts/audit-vsix.mjs extension.vsix

      - name: Record .vsix digest
        id: digest
        run: |
          checksum=$(sha256sum extension.vsix)
          echo "sha256=${checksum%% *}" >> "$GITHUB_OUTPUT"

      # Hand off the audited .vsix and SBOM for attestation and publishing.
      # Each consumer compares the .vsix with build's recorded file digest.
      # The SBOM relies on download-artifact's artifact-level digest check.
      - name: Upload audited .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-vsix
          path: |
            extension.vsix
            sbom.spdx.json
          if-no-files-found: error
          # Keep the audited bytes available for retries. After expiry the
          # download fails closed.
          retention-days: 7

  attest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download audited .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix

      # Require the file digest recorded after audit before signing either attestation.
      - name: Verify .vsix digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.vsix-sha256 }}
        run: echo "$EXPECTED_SHA256  extension.vsix" | sha256sum -c -

      # Signed build provenance for the exact bytes we are about to publish, via
      # the unified actions/attest (Provenance mode = no sbom-path). GitHub has
      # folded the older attest-build-provenance / attest-sbom wrappers into this
      # action (attest-sbom is deprecated), so we use the canonical core action
      # for both legs. Attests extension.vsix against the workflow run through
      # Sigstore; consumers verify with
      # `gh attestation verify extension.vsix --repo mtskf/quoll`. Placed before
      # publish so an attestation failure blocks the release rather than shipping
      # an unattested artifact, and so the attested digest equals the bytes
      # handed to Marketplace + Open VSX.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: extension.vsix

      # Bind the SBOM to the same .vsix digest (SBOM mode = sbom-path) so a
      # consumer can retrieve the dependency graph for the artifact they got.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: extension.vsix
          sbom-path: sbom.spdx.json

  publish-marketplace:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Every step with this job's OIDC grant can mint a Marketplace credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.10.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # For the lockfile-pinned vsce + ovsx. pnpm-workspace.yaml denies every
      # dependency build script, so no package code runs at install time.
      - name: Install publish tooling
        run: pnpm install --frozen-lockfile

      - name: Download audited .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix

      # OIDC Trusted Publishing: vsce exchanges this job's GitHub OIDC token
      # (audience marketplace.visualstudio.com, via this job's
      # `id-token: write`) for a short-lived Marketplace credential. The
      # publisher's Trusted Publishing policy (owner mtskf, repo quoll, workflow
      # publish.yml, no environment) decides who may publish, so this step
      # needs no long-lived PAT. Why now: Azure DevOps retires Global PATs on
      # 2027-01-27, which would have broken the VSCODE_PAT path. Needs
      # @vscode/vsce >= 4.1.0: 4.0.0's token exchange omits `api-version`, so
      # the Marketplace answers 400. Renaming this file breaks the policy match.
      - name: Publish to VS Code Marketplace
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.vsix-sha256 }}
        run: scripts/publish-registry.sh marketplace extension.vsix "$EXPECTED_SHA256"

  publish-openvsx:
    needs: [build, attest, publish-marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.10.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # For the lockfile-pinned vsce + ovsx. pnpm-workspace.yaml denies every
      # dependency build script, so no package code runs at install time.
      - name: Install publish tooling
        run: pnpm install --frozen-lockfile

      - name: Download audited .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix

      # Pass the token through the environment to keep it out of process arguments.
      # The script fails on an empty secret so this job can be retried after rotation.
      - name: Publish to Open VSX
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.vsix-sha256 }}
          OVSX_PAT: ${{ secrets.OPENVSX_PAT }}
        run: scripts/publish-registry.sh openvsx extension.vsix "$EXPECTED_SHA256"
