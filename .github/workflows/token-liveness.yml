name: Publish Token Liveness

# Weekly liveness ping for the two publish credentials.
#
# WHY: `vsce publish` / `ovsx publish` are the LAST steps of publish.yml, after
# the reachability gate, the audits, the build, the SBOM and both attestations.
# An expired token therefore burns a whole release run and blocks the release at
# the worst possible moment. That has now happened to both: `VSCODE_PAT` expiry
# killed the v0.1.66 publish, and `OPENVSX_PAT` sat invalid for ~5 releases
# without anyone noticing. This job moves that discovery off the release path —
# it asks each registry whether the stored secret is still valid, on a schedule,
# and goes red when the answer is no.
#
# WHAT "STILL VALID" DOES AND DOES NOT COVER: the Marketplace leg is a liveness
# check, not a capability check. `vsce verify-pat` only calls the Azure DevOps
# `getRoleAssignments` API, and per @vscode/vsce's own source comment that
# returns 200 for ANY role on the publisher — Creator, Owner, Contributor or
# Reader. A read-only PAT therefore passes this probe green while being unable
# to publish, so this ping catches expiry and revocation but NOT a wrong-scope
# rotation. When rotating VSCODE_PAT, issue it with the Marketplace *Manage*
# scope; nothing here will tell you if you did not. The Open VSX leg is outside
# that caveat — its `verify-pat` endpoint is a genuine publish-capability check.
#
# NO IN-BAND GATE (deliberate): this cron is an EARLY WARNING, meant to find a
# dead token days before a release rather than seconds into one. A second,
# complementary guard — verifying both PATs at the TOP of publish.yml, so a
# doomed release dies in ~30s instead of after the full build/SBOM/attest
# sequence — is genuinely worth having, but it edits the release-critical
# workflow and warrants its own review; it is tracked as a follow-up, not folded
# in here.
#
# READ-ONLY BY CONSTRUCTION: `verify-pat` is a pure read on both CLIs —
# `vsce verify-pat` calls the Azure DevOps `getRoleAssignments` API, and
# `ovsx verify-pat` GETs `api/<namespace>/verify-pat`. Nothing is packaged,
# uploaded or published here, and nothing may ever be:
# test/build/token-liveness-workflow-readonly.test.ts pins that.
#
# It probes with the SAME lockfile-pinned `vsce` / `ovsx` binaries publish.yml
# uses, so a CLI-side auth regression surfaces here too — not just token expiry.
#
# HOW A FAILURE REACHES A HUMAN: GitHub emails the account that most recently
# modified this file's cron when a scheduled run fails, and the run shows red in
# the Actions tab. Note the platform rule that comes with `schedule:` — GitHub
# disables scheduled workflows after 60 days with no repo activity, so a long
# quiet spell silences this ping rather than failing it.
#
# SELF-VERIFYING AN EDIT: `workflow_dispatch` becomes dispatchable only once a
# copy of this file carrying that trigger has landed on the default branch, so
# the FIRST version cannot be exercised from its own branch — merge it, then
# dispatch it once manually (Actions › Publish Token Liveness › Run workflow)
# and confirm it goes green. That is a one-time bootstrap caveat, not a standing
# rule: from then on "Run workflow" offers a "Use workflow from" ref picker, and
# GitHub runs the file from the ref you pick rather than the default branch's
# copy. In THIS repo, however, the default-branch guard that opens the job below
# exits non-zero on any other ref, so dispatching a branch proves only that the
# guard fires. Verification of an edit here happens on `main`, after merge.

on:
  schedule:
    # Mondays 06:17 UTC. Early enough in the week to rotate a token before a
    # release, off the hour because GitHub's on-the-hour cron slots are the
    # congested ones.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: checkout + install only. The registry probes
# authenticate with the VSCODE_PAT / OPENVSX_PAT secrets, not the workflow
# token, so no write scope is needed anywhere in this file.
permissions:
  contents: read

jobs:
  verify-tokens:
    runs-on: ubuntu-latest
    steps:
      # Guard, not a boundary. `workflow_dispatch` only needs the trigger to exist on the
      # default branch; the RUN uses whichever ref the dispatcher selects, and that ref
      # supplies this very file — so anyone who can edit it can also delete this check.
      # What it does buy is that an ACCIDENTAL dispatch of a feature branch stops here
      # instead of handing live publish tokens to a branch build, and that it stops LOUDLY:
      # a job-level `if:` would report the run as successful-but-skipped, the one outcome a
      # liveness ping must never produce. The real boundary is a GitHub Environment whose
      # deployment-branch policy holds the two secrets; that needs repo configuration and is
      # tracked separately. `main` is spelled out rather than read from the event payload
      # because a payload field that is absent on `schedule` would fail every weekly run —
      # publish.yml pins `origin/main` by name for the same reason.
      #
      # Compares the FULL ref, not `github.ref_name`. `ref_name` is the short name
      # of a branch OR a tag, so it reads `main` for both `refs/heads/main` and a
      # tag literally named `main` — and `workflow_dispatch` accepts a tag as its
      # ref. A short-name comparison would therefore wave through a `main` tag
      # carrying edited workflow content. `GITHUB_REF` is a default Actions
      # environment variable holding `github.ref`, and it is set on `schedule`
      # runs too (as the default branch's ref), so no `env:` mapping is needed.
      - name: Refuse to run off the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to run on '$GITHUB_REF' — this job holds live publish tokens and only runs on the main branch."
            exit 1
          fi

      # All GitHub Actions are pinned to commit SHAs — supply-chain hardening.
      # The threat (tag remutation against a compromised maintainer / repo) applies
      # equally to first-party `actions/*` and third-party actions, so the same
      # policy covers both. When bumping, resolve the commit SHA with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'` — this handles both
      # lightweight and annotated tags (e.g. `pnpm/action-setup` uses annotated tags,
      # and `git/refs/tags/<tag>` would return its tag-object SHA, not the commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Full install (not `--prod`): `@vscode/vsce` and `ovsx` are devDependencies,
      # and the lockfile is what keeps this probe on the same CLI versions the
      # release uses.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The Marketplace publisher and the Open VSX namespace are both
      # `package.json.publisher` — the same value publish.yml publishes under.
      # Derived rather than hard-coded so a publisher rename cannot leave this
      # workflow cheerfully verifying a stale identity.
      - name: Resolve publisher id
        id: publisher
        run: |
          publisher="$(node -p "require('./package.json').publisher ?? ''")"
          if [ -z "$publisher" ]; then
            echo "::error::package.json has no 'publisher' field — cannot verify publish rights."
            exit 1
          fi
          echo "Publisher / namespace: $publisher"
          echo "id=$publisher" >> "$GITHUB_OUTPUT"

      # Both probes carry their token in the environment, never as a `-p <token>`
      # CLI argument, so the secret cannot leak into process arguments — same
      # rationale as publish.yml's publish steps.
      #
      # The empty-secret guard is load-bearing, not defensive noise: with no token
      # in the environment BOTH CLIs fall through to an interactive prompt
      # (`vsce`'s credential store -> `read()`, `ovsx`'s `getPAT` -> `getUserInput`),
      # which on a runner means a hang or an opaque stdin error instead of the
      # plain "the secret is gone" this job exists to report.
      - name: Verify VS Code Marketplace token (VSCODE_PAT)
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PAT }}
          PUBLISHER: ${{ steps.publisher.outputs.id }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::error::VSCODE_PAT is unset or empty — publish.yml would fail at its Marketplace publish step."
            exit 1
          fi
          pnpm exec vsce verify-pat "$PUBLISHER"

      # `!cancelled()` so a dead VSCODE_PAT cannot mask a dead OPENVSX_PAT. Under
      # the default (fail-fast) behaviour one bad token would hide the other, which
      # is precisely how OPENVSX_PAT went unnoticed across ~5 releases — every run
      # must report a verdict for BOTH tokens.
      #
      # `steps.publisher.outcome == 'success'` narrows that, because `!cancelled()`
      # alone is too wide: it also runs this step when the ref guard, the install or
      # the publisher lookup failed, none of which say anything about this token.
      # `NAMESPACE` would then be empty and the probe would fail on the argument
      # rather than on the credential — leaving a red step literally named "Verify
      # Open VSX token" that never tested OPENVSX_PAT at all, which reads as "the
      # second token is dead too". Skipping is the honest verdict there; the real
      # failure is already red one step up.
      - name: Verify Open VSX token (OPENVSX_PAT)
        if: ${{ !cancelled() && steps.publisher.outcome == 'success' }}
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_PAT }}
          NAMESPACE: ${{ steps.publisher.outputs.id }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPENVSX_PAT is unset or empty — publish.yml SKIPS its Open VSX step in this state, so releases would silently stop reaching Open VSX."
            exit 1
          fi
          pnpm exec ovsx verify-pat "$NAMESPACE"
