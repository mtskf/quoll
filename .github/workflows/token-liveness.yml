name: Open VSX Token Liveness

# Weekly liveness ping for the one long-lived publish credential, OPENVSX_PAT.
#
# WHY: Open VSX publishes after the build, both attestations and Marketplace.
# An expired or empty OPENVSX_PAT fails that final job, which can be retried
# with the audited .vsix after the secret is fixed. OPENVSX_PAT previously sat
# invalid for ~5 releases without anyone noticing. This job
# moves that discovery off the release path — it asks Open VSX whether the
# stored secret is still valid, on a schedule, and goes red when the answer is
# no. `ovsx verify-pat` is a genuine publish-capability check, not just a
# liveness one.
#
# WHY THERE IS NO MARKETPLACE PROBE: publish.yml publishes to the Marketplace
# with OIDC Trusted Publishing (`vsce publish --oidc`), so there is no
# long-lived Marketplace token left to expire or to probe. The OIDC leg's own
# failure modes — a policy that no longer matches the workflow, or a CLI-side
# exchange bug like the one that made @vscode/vsce < 4.1.0 send a request the
# Marketplace rejected — are only exercised by a real publish, so this cron
# cannot see them.
#
# NO IN-BAND GATE (deliberate): this cron is an EARLY WARNING, meant to find a
# dead token days before a release rather than seconds into one. A second,
# complementary guard — verifying the PAT at the TOP of publish.yml, so a
# doomed release dies in ~30s instead of after the full build/SBOM/attest
# sequence — is genuinely worth having, but it edits the release-critical
# workflow and warrants its own review; it is tracked as a follow-up, not folded
# in here.
#
# READ-ONLY BY CONSTRUCTION: `ovsx verify-pat` is a pure read — it GETs
# `api/<namespace>/verify-pat`. Nothing is packaged, uploaded or published
# here, and nothing may ever be:
# test/build/token-liveness-workflow-readonly.test.ts pins that.
#
# It probes with the SAME lockfile-pinned `ovsx` binary publish.yml uses, so a
# CLI-side auth regression surfaces here too — not just token expiry.
#
# HOW A FAILURE REACHES A HUMAN: GitHub emails the account that most recently
# modified this file's cron when a scheduled run fails, and the run shows red in
# the Actions tab. Note the platform rule that comes with `schedule:` — GitHub
# disables scheduled workflows after 60 days with no repo activity, so a long
# quiet spell silences this ping rather than failing it.
#
# SELF-VERIFYING AN EDIT: `workflow_dispatch` becomes dispatchable only once a
# copy of this file carrying that trigger has landed on the default branch, so
# the FIRST version cannot be exercised from its own branch — merge it, then
# dispatch it once manually (Actions › Open VSX Token Liveness › Run workflow)
# and confirm it goes green. That is a one-time bootstrap caveat, not a standing
# rule: from then on "Run workflow" offers a "Use workflow from" ref picker, and
# GitHub runs the file from the ref you pick rather than the default branch's
# copy. In THIS repo, however, the default-branch guard that opens the job below
# exits non-zero on any other ref, so dispatching a branch proves only that the
# guard fires. Verification of an edit here happens on `main`, after merge.

on:
  schedule:
    # Mondays 06:17 UTC. Early enough in the week to rotate a token before a
    # release, off the hour because GitHub's on-the-hour cron slots are the
    # congested ones.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: checkout + install only. The registry probe
# authenticates with the OPENVSX_PAT secret, not the workflow token, so no
# write scope is needed anywhere in this file.
permissions:
  contents: read

jobs:
  verify-tokens:
    runs-on: ubuntu-latest
    steps:
      # Guard, not a boundary. `workflow_dispatch` only needs the trigger to exist on the
      # default branch; the RUN uses whichever ref the dispatcher selects, and that ref
      # supplies this very file — so anyone who can edit it can also delete this check.
      # What it does buy is that an ACCIDENTAL dispatch of a feature branch stops here
      # instead of handing a live publish token to a branch build, and that it stops LOUDLY:
      # a job-level `if:` would report the run as successful-but-skipped, the one outcome a
      # liveness ping must never produce. The real boundary is a GitHub Environment whose
      # deployment-branch policy holds the secret; that needs repo configuration and is
      # tracked separately. `main` is spelled out rather than read from the event payload
      # because a payload field that is absent on `schedule` would fail every weekly run —
      # publish.yml pins `origin/main` by name for the same reason.
      #
      # Compares the FULL ref, not `github.ref_name`. `ref_name` is the short name
      # of a branch OR a tag, so it reads `main` for both `refs/heads/main` and a
      # tag literally named `main` — and `workflow_dispatch` accepts a tag as its
      # ref. A short-name comparison would therefore wave through a `main` tag
      # carrying edited workflow content. `GITHUB_REF` is a default Actions
      # environment variable holding `github.ref`, and it is set on `schedule`
      # runs too (as the default branch's ref), so no `env:` mapping is needed.
      - name: Refuse to run off the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to run on '$GITHUB_REF' — this job holds a live publish token and only runs on the main branch."
            exit 1
          fi

      # All GitHub Actions are pinned to commit SHAs — supply-chain hardening.
      # The threat (tag remutation against a compromised maintainer / repo) applies
      # equally to first-party `actions/*` and third-party actions, so the same
      # policy covers both. When bumping, resolve the commit SHA with
      # `gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'` — this handles both
      # lightweight and annotated tags (e.g. `pnpm/action-setup` uses annotated tags,
      # and `git/refs/tags/<tag>` would return its tag-object SHA, not the commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Full install (not `--prod`): `ovsx` is a devDependency, and the lockfile
      # is what keeps this probe on the same CLI version the release uses.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The Open VSX namespace is `package.json.publisher` — the same value
      # publish.yml publishes under. Derived rather than hard-coded so a
      # publisher rename cannot leave this workflow cheerfully verifying a stale
      # identity.
      - name: Resolve publisher id
        id: publisher
        run: |
          publisher="$(node -p "require('./package.json').publisher ?? ''")"
          if [ -z "$publisher" ]; then
            echo "::error::package.json has no 'publisher' field — cannot verify publish rights."
            exit 1
          fi
          echo "Publisher / namespace: $publisher"
          echo "id=$publisher" >> "$GITHUB_OUTPUT"

      # The token rides in the environment, never as a `-p <token>` CLI
      # argument, so the secret cannot leak into process arguments — same
      # rationale as publish.yml's Open VSX publish step.
      #
      # The empty-secret guard is load-bearing, not defensive noise: with no
      # token in the environment `ovsx` falls through to an interactive prompt
      # (`getPAT` -> `getUserInput`), which on a runner means a hang or an
      # opaque stdin error instead of the plain "the secret is gone" this job
      # exists to report.
      #
      # No `if:` here: with a single probe there is no second verdict for a
      # failure to mask, and the default skips this step when setup failed —
      # the honest outcome, since an empty NAMESPACE would fail on the argument
      # rather than on the credential.
      - name: Verify Open VSX token (OPENVSX_PAT)
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_PAT }}
          NAMESPACE: ${{ steps.publisher.outputs.id }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPENVSX_PAT is unset or empty. The Open VSX publish job fails until the secret is set."
            exit 1
          fi
          pnpm exec ovsx verify-pat "$NAMESPACE"
