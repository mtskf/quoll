# Dependabot version-update config. Complements the repo-level Dependabot
# security-updates toggle (already enabled) — that raises urgent advisory PRs
# regardless of the grouping below.
#
# Goal: keep dependencies visible without daily churn. Routine minor+patch
# bumps arrive grouped, a few PRs per ecosystem per week; majors still open
# individually because they usually need a manual look (vitest's are the
# exception — see its group).
version: 2
updates:
  # pnpm dependency graph (Dependabot reads pnpm-lock.yaml under the `npm`
  # ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # A dependency joins the first group it matches, so the catch-all is last.
    groups:
      # The runtime dependencies. The editor mirrors Lezer internals, so a
      # parser bump can need code changes; kept apart so it never holds the
      # tooling bumps red, or the reverse.
      codemirror-lezer:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
        update-types:
          - minor
          - patch
      # @vitest/* peer on vitest by exact version, so they move together,
      # majors included (#404).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-and-patch:
        patterns:
          - "*"
        # A Biome bump can reformat files; its red lint step skipped every
        # later CI step for the 14 other bumps in the same PR (#432).
        exclude-patterns:
          - "@biomejs/biome"
        update-types:
          - minor
          - patch
    ignore:
      # mocha 12 requires Node ^20.19 || >=22.12; the E2E suite runs in the
      # extension host of the pinned VS Code (1.94, Node 20.16). Drop this
      # entry when engines.vscode moves past that (#427).
      - dependency-name: "mocha"
        update-types:
          - "version-update:semver-major"
      # engines.vscode <-> @types/vscode <-> @types/node are exact-version pins
      # bumped together by hand on a matching VS Code Electron-Node release
      # (CLAUDE.md "Dependency pins"). Silence only their routine VERSION updates
      # so Dependabot never opens a lone, policy-violating bump — the
      # update-types scoping leaves the security-update path intact (raised via
      # the repo-level Dependabot security-updates toggle).
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # First-party + third-party GitHub Actions used by the workflows under
  # .github/workflows/ (`directory: "/"` covers all of them, so a new workflow
  # needs no entry here).
  # Every action is SHA-pinned; Dependabot bumps the SHA and refreshes the
  # trailing version comment, keeping the pin convention intact.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        # Match the npm group: routine minor+patch bumps ride one grouped PR,
        # while action majors (which can change runner/runtime expectations)
        # open individually for a manual look.
        update-types:
          - minor
          - patch
